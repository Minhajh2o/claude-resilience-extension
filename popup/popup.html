<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Claude Resilience Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 280px;
      padding: 16px;
      margin: 0;
      background: #ffffff;
      color: #0f172a;
    }
    h3 {
      margin: 0 0 4px 0;
      font-size: 15px;
      color: #ea580c;
    }
    p.desc {
      font-size: 12px;
      color: #64748b;
      margin: 0 0 14px 0;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      display: block;
      margin-top: 10px;
      color: #334155;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
      margin-top: 4px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 12px;
    }
    input:focus {
      outline: none;
      border-color: #ea580c;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 9px;
      background: #ea580c;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
    }
    button:hover {
      background: #c2410c;
    }
    #status {
      font-size: 11px;
      margin-top: 10px;
      text-align: center;
      min-height: 16px;
    }
    .metrics {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <h3>Claude Resilience</h3>
  <p class="desc">Free Tier Recovery & Alerts</p>

  <label for="toEmail">Notification Email:</label>
  <input type="email" id="toEmail" placeholder="your-email@gmail.com" />

  <label for="apiKey">Resend API Key:</label>
  <input type="password" id="apiKey" placeholder="re_123456789..." />

  <button id="saveBtn">Save Settings</button>
  <div id="status"></div>

  <div class="metrics" id="metrics">
    Status: Connecting...
  </div>

  <script src="popup.js"></script>
</body>
</html>
